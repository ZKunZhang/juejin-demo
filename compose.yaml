services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mazhan
      POSTGRES_PASSWORD: mazhan_local
      POSTGRES_DB: mazhan_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mazhan -d mazhan_dev"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  postgres-data:
